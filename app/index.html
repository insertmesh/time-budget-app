<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Budget</title>
<!--
  Time Budget app with its navigation (step 02k_app_navigation, 2026-11-18).
  Bottom bar: Tap · Plans · Overviews · Rewards · More (design: ..\mockup\02k_navigation\navigation.html).
  Tap = the REAL working tap timer (timer.html, step 04b; data saved in this browser).
  All other screens = the approved design mockups from ..\mockup\ (look only, they don't work yet).
  Open: double-click this file. Keep the folders app\ and mockup\ next to each other.
  Links inside a screen are routed by messages (postMessage), so this also works from disk.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --ink: #1D2927; --muted: #5E6D68; --line: #DCE3DF;
  --accent: #3D6B5E; --accent-soft: #DDEAE4; --badge: #C0522F;
  --font-ui: "Figtree", system-ui, "Segoe UI", sans-serif;
  --font-head: "Literata", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #131A18; --surface: #1A2320; --ink: #E3EBE7; --muted: #9DABA5; --line: #2A3632;
    --accent: #8FC4B3; --accent-soft: #213430; --badge: #E07A55; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); display: flex; flex-direction: column; align-items: center; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }

/* phone-sized app; on a phone it fills the screen */
.phone { position: relative; width: 100%; max-width: 440px; height: min(900px, calc(100dvh - 56px)); margin: 16px 16px 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
.note { max-width: 440px; padding: 8px 16px 12px; font-size: 12px; color: var(--muted); text-align: center; }
.note a { color: var(--muted); }
@media (max-width: 480px) {
  .phone { margin: 0; height: 100dvh; border: 0; border-radius: 0; max-width: none; }
  .note { display: none; }
}

.subhead { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
.subhead b { font: 600 17px/1.2 var(--font-head); }
.backbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 8px 6px 0; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.backbtn .chev { font-size: 24px; line-height: 1; margin-top: -3px; }
.frames { flex: 1; position: relative; }
.frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--surface); }
.frames iframe.off { display: none; }

.pill { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 12px 6px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); text-align: left; font-size: 14px; }
.pill .art { width: 30px; height: 30px; flex: none; }
.pill b { font-variant-numeric: tabular-nums; }
.pill .go { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 13px; }

.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.tab { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px 3px; border-radius: 14px;
  color: var(--muted); font-size: 12px; font-weight: 600; -webkit-tap-highlight-color: transparent; min-height: 52px; }
.tab .ic { width: 30px; height: 30px; display: grid; place-items: center; position: relative; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab .ic .art { width: 30px; height: 30px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 800; }
.tab[aria-current="page"] .ic { background: var(--accent-soft); border-radius: 10px; }
.tab .ic.tileic { background: none !important; }
.tab[aria-current="page"] .ic.tileic .art { transform: scale(1.12); }
.phone.covered .tabbar, .phone.covered .pill { display: none; }

.art { position: relative; display: block; }
.layer, .place, .layer img, .place img { position: absolute; inset: 0; width: 100%; height: 100%; }
.place { transform-origin: 0 0; }
.layer img, .place img { display: block; pointer-events: none; user-select: none; }
.bgwrap { filter: drop-shadow(1px 3px 3px rgba(40, 25, 10, .35)); }
.patchclip { clip-path: inset(12.3% 11.5% 12.9% 11.7% round 7%); }

.toast { position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="subhead" id="subhead" hidden></div>
  <div class="frames" id="frames"></div>
  <button type="button" class="pill" id="pill" hidden></button>
  <nav class="tabbar" id="tabbar" aria-label="App navigation"></nav>
  <div id="toastHost"></div>
</div>
<p class="note">Tap = the real tap timer (saves in this browser). Plans, Overviews, Rewards and More show the approved designs; they don't work yet. <a href="../mockup/02k_navigation/navigation.html">How the navigation works</a></p>

<script>
(function () {
const $ = id => document.getElementById(id);
const M = '../mockup/';
const A = M + 'v6/assets/';

/* ---------- felt tile art for the Tap button + strip (positions from mockup 02g) ---------- */
const BOX = {
  a01: [[102,29,405,481],[55,119,376,440],[303,168,453,355]], a02: [[22,23,489,489],[33,117,341,464],[266,167,470,370]],
  a03: [[77,43,434,376],[102,39,409,337],[240,163,488,347]],  a04: [[92,29,386,477],[56,29,477,487],[412,76,452,433]],
  a05: [[118,32,391,487],[57,29,264,460],[263,151,485,357]],  a06: [[32,47,479,453],[122,284,391,486],[246,71,485,327]],
  a08: [[99,57,399,456],[252,173,464,346],[164,11,344,155]],  a09: [[44,35,490,482],[35,99,482,437],[310,165,474,405]]
};
const TILES = {
  a09: [[2,[82,230,250,400],'b'],[1,[150,130,420,420],'b'],[3,[345,105,432,230],'c']],
  a08: [[1,[110,95,410,425],'b',1]],
  a05: [[2,[82,190,200,425],'b'],[1,[160,95,350,425],'b'],[3,[325,215,432,325],'c']],
  a06: [[2,[165,335,345,432],'b'],[1,[95,85,365,370],'b'],[3,[330,215,432,330],'c']],
  a01: [[1,[170,100,385,425],'b'],[2,[82,245,250,425],'b'],[3,[350,300,428,405],'b']],
  a02: [[1,[150,95,400,425],'b'],[2,[82,210,240,425],'b'],[3,[330,110,432,215],'c']],
  a04: [[2,[82,120,225,425],'b'],[1,[160,95,375,425],'b'],[3,[380,130,425,410],'b']],
  a03: [[2,[95,90,200,190],'c'],[1,[120,200,395,420],'b'],[3,[320,240,432,330],'c']]
};
const BYNAME = { Work: 'a09', Commute: 'a08', Chores: 'a05', Food: 'a06', Family: 'a01', Friends: 'a02', Hobby: 'a04', Hobbies: 'a04', Chill: 'a03', Chilling: 'a03' };
const BG_SCALE = { 1: 1, 2: 1.037, 3: 1.22 };
const pct = px => (px / 512 * 100).toFixed(2) + '%';
function art(id) {
  const n = ((parseInt(id.slice(1), 10) - 1) % 3) + 1;
  let h = `<span class="art"><span class="layer bgwrap" style="transform:scale(${BG_SCALE[n]})"><img src="${A}background_rgba_0000${n}_.png" alt=""></span>`;
  TILES[id].forEach(([e, r, a, clip]) => {
    const b = BOX[id][e - 1], s = Math.min((r[2] - r[0]) / (b[2] - b[0]), (r[3] - r[1]) / (b[3] - b[1]));
    const tx = (r[0] + r[2]) / 2 - s * (b[0] + b[2]) / 2, ty = a === 'c' ? (r[1] + r[3]) / 2 - s * (b[1] + b[3]) / 2 : r[3] - s * b[3];
    h += `<span class="layer${clip ? ' patchclip' : ''}"><span class="place" style="transform:translate(${pct(tx)}, ${pct(ty)}) scale(${s.toFixed(4)})"><img src="${A}${id}_e${e}_00001_.png" alt=""></span></span>`;
  });
  return h + '</span>';
}
const ICON = {
  tap:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>',
  plans: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/></svg>',
  overviews: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>',
  rewards: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  more:  '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
};
const TABS = [['tap','Tap'],['plans','Plans'],['overviews','Overviews'],['rewards','Rewards'],['more','More']];

/* ---------- screens: the real timer + the approved mockups (plain names, Decision 2026-11-17) ---------- */
const PAGE = {
  tap: 'timer.html', plans: M + '02a_plans/plans.html', overviews: M + '02c_overviews/overviews.html', rewards: M + '02d_rewards/rewards.html',
  categories: M + '02b_categories/categories.html', goals: M + '02b_categories/categories.html#cat=a04', settings: M + '02e_settings/settings.html',
  rules: M + '02f_content/content.html#tbshow=rules', tour: M + '02f_content/content.html#tbshow=onb',
  checkin: M + '06_checkin/checkin.html', journey: M + '07_journey/journey.html', yes: M + '08_yes_check/yes_check.html', more: null
};
const TITLE = { tap: 'Tap', plans: 'Plans', overviews: 'Overviews', rewards: 'Rewards', more: 'More', categories: 'Categories', goals: 'Goals',
  settings: 'Settings', rules: 'Rules', tour: 'Tour', checkin: 'Check-in', journey: 'Journey', yes: 'Yes-check' };
const MORE = [['categories','▤','Categories'],['goals','◎','Goals'],['settings','⚙','Settings'],['rules','?','Rules'],['tour','▶','Tour (onboarding)'],
  ['checkin','☾','Check-in · coming (06)'],['journey','➶','Journey · coming (07)'],['yes','✓','Yes-check · coming (08)']];
const pathOf = u => decodeURIComponent(new URL(u, location.href).pathname);
function keyOf(href) {         // which screen is this URL? (mockup links point to ../02g_tap/tap.html for the tap screen)
  const path = pathOf(href), hash = new URL(href, location.href).hash;
  if (path.endsWith('/02g_tap/tap.html') || path.endsWith('/app/timer.html') || path.endsWith('/app/index.html')) return 'tap';
  if (path.endsWith('/02b_categories/categories.html')) return /cat=/.test(hash) ? 'goals' : 'categories';
  for (const k in PAGE) if (PAGE[k] && path === pathOf(PAGE[k])) return k;
  return null;
}

/* ---------- state ---------- */
let S = { tab: 'tap', stacks: {}, run: null, covered: false, sig: '' };
TABS.forEach(([k]) => S.stacks[k] = [{ id: k, url: PAGE[k] }]);
const cur = () => S.stacks[S.tab][S.stacks[S.tab].length - 1];

function makeFrame(entry) {
  const f = document.createElement('iframe');
  f.title = TITLE[entry.id];
  if (entry.id === 'more') f.srcdoc = moreDoc(); else f.src = entry.url;
  $('frames').appendChild(f);
  entry.frame = f;
}
function moreDoc() {   // the More list
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n);
  return `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Literata:opsz,wght@7..72,600&display=swap">
  <style>body{margin:0;padding:14px 16px;background:${v('--surface')};color:${v('--ink')};font:15px/1.5 Figtree,system-ui,sans-serif}
  h1{font:600 22px/1.2 Literata,Georgia,serif;margin:0 0 8px}button{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;padding:11px 2px;border-bottom:1px solid ${v('--line')};cursor:pointer;font-weight:600}
  button i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:${v('--accent-soft')};color:${v('--accent')};margin-right:10px}
  button b{margin-left:auto;color:${v('--muted')};font-size:20px;font-weight:400}button.soon{color:${v('--muted')};font-weight:500;font-style:italic}
  p{font-size:12px;color:${v('--muted')}}</style></head><body><h1>More</h1>
  ${MORE.map(([k, i, l]) => `<button class="${/coming/.test(l) ? 'soon' : ''}" onclick="parent.postMessage({tbPush:'${k}'},'*')"><i>${i}</i>${l}<b>›</b></button>`).join('')}
  <p>Export / import of your tapped data: on the Tap screen, below the timer.</p></body></html>`;
}

/* ---------- messages from the screens ---------- */
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.tbPush && PAGE[m.tbPush]) return push(m.tbPush);
  if (m.tbRun) {
    S.run = m.tbRun.name ? m.tbRun : null;
    S.covered = S.tab === 'tap' && !!m.tbRun.covered;
    return drawBar();
  }
  if (m.tbAt) {                                    // a screen finished loading: is it still the screen it should be?
    let entry = null;
    TABS.forEach(([k]) => S.stacks[k].forEach(en => { if (en.frame && en.frame.contentWindow === e.source) entry = en; }));
    if (!entry || pathOf(m.tbAt) === pathOf(entry.url)) return;
    entry.frame.src = entry.url;                   // a link inside the screen went elsewhere: put the screen back …
    const k = keyOf(m.tbAt);
    if (k) route(k, m.tbAt);                       // … and open the other one the app's way
  }
});
function route(k, href) {
  const st = S.stacks[S.tab];
  if (st.length > 1 && st[st.length - 2].id === k) return back();
  if (S.stacks[k] && k !== S.tab) return goTab(k);   // a link to Tap / Plans / … switches to that tab
  if (k !== S.tab) push(k, PAGE[k] === null ? null : (k === 'goals' || k === 'categories' ? href : PAGE[k]));
}

/* ---------- moves ---------- */
function goTab(k) {
  if (k === S.tab) {                               // tapping the current tab: back to its first screen
    const st = S.stacks[k];
    if (st.length > 1) { st.splice(1).forEach(e => e.frame && e.frame.remove()); show(); }
    return;
  }
  S.tab = k; show();
}
function push(id, url) { S.stacks[S.tab].push({ id, url: url || PAGE[id] }); show(); }
function back() {
  const st = S.stacks[S.tab];
  if (st.length > 1) { const e = st.pop(); if (e.frame) e.frame.remove(); show(); }
  else if (S.tab !== 'tap') goTab('tap');
}

/* ---------- draw ---------- */
function show() {
  const e = cur();
  if (!e.frame) makeFrame(e);
  [...$('frames').children].forEach(f => f.classList.toggle('off', f !== e.frame));
  const st = S.stacks[S.tab], sh = $('subhead');
  sh.hidden = st.length < 2;
  if (!sh.hidden) sh.innerHTML = `<button class="backbtn" id="subBack"><span class="chev">‹</span>${TITLE[st[st.length - 2].id]}</button><b>${TITLE[e.id]}</b>`;
  if (S.tab !== 'tap') S.covered = false;
  S.sig = ''; drawBar();
}
function drawBar() {
  const run = S.run, id = run && BYNAME[run.name.split(' · ')[0].trim()];
  $('phone').classList.toggle('covered', S.covered);
  const p = $('pill');
  p.hidden = !(S.tab !== 'tap' && run);
  if (!p.hidden) p.innerHTML = `${id ? art(id) : ''}<span>${run.name} · <b>${run.clock}</b></span><span class="go">Tap ›</span>`;
  const sig = [S.tab, id].join('|');
  if (sig === S.sig) return;
  S.sig = sig;
  $('tabbar').innerHTML = TABS.map(([k, l]) => {
    const ic = k === 'tap' && id ? `<span class="ic tileic">${art(id)}` : `<span class="ic">${ICON[k]}`;
    return `<button type="button" class="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic}</span>${l}</button>`;
  }).join('');
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) return goTab(t.dataset.tab);
  if (t.id === 'subBack') return back();
  if (t.id === 'pill') return goTab('tap');
});
show();
})();
</script>
</body>
</html>
