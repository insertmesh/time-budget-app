  }
  if ((el = e.target.closest('[data-val]'))) { var v = el.dataset.val.split('|'); S.ans[v[0]][v[1]] = +v[2]; render(); return; }
  if ((el = e.target.closest('[data-sv]'))) { var s = el.dataset.sv.split('|'); S.ans[s[0]][s[1]] = clamp(S.ans[s[0]][s[1]] + (+s[2]), +s[3], +s[4]); render(); return; }
  if (e.target.closest('[data-fadd]')) { A('travel','trips').push({ name:'', days:[], start:null, len:30 }); render(); return; }
  if ((el = e.target.closest('[data-tripidea]'))) { A('travel','trips').push({ name:decodeURIComponent(el.dataset.tripidea), days:[], start:null, len:30 }); render(); return; }
  if ((el = e.target.closest('[data-fstart]'))) { var fq = el.dataset.fstart.split('|'), ti = A('travel','trips')[+fq[0]]; ti.start = fq[1] === 'set' ? 720 : null; render(); return; }
  if ((el = e.target.closest('[data-fdel]'))) { A('travel','trips').splice(+el.dataset.fdel, 1); render(); return; }
  if ((el = e.target.closest('[data-fday]'))) { var f = el.dataset.fday.split('|'); toggle(A('travel','trips')[+f[0]].days, +f[1]); render(); return; }
  if ((el = e.target.closest('[data-fstep]'))) { var fs = el.dataset.fstep.split('|'), it = A('travel','trips')[+fs[0]]; it[fs[1]] = fs[1] === 'start' ? clamp(it.start + (+fs[2]), 300, 1380) : clamp(it.len + (+fs[2]), 5, 480); render(); return; }
  if (e.target.closest('[data-intro]')) { S.introSeen = true; S.view = 'home'; render(); return; }
  if ((el = e.target.closest('[data-early]'))) S.early[el.dataset.early] = true;
  if ((el = e.target.closest('[data-go]'))) { var go = el.dataset.go; S.view = go; if (go === 'q') { var nx = S.qDone.indexOf(false); S.q = nx < 0 ? 0 : nx; } render(); return; }
  if ((el = e.target.closest('[data-toast]'))) { toast(el.dataset.toast); return; }
  if ((el = e.target.closest('[data-w]'))) { var w = el.dataset.w.split('|'), cur = weekLines().filter(function (l) { return l.id === w[0]; })[0].h; S.over[w[0]] = clamp(cur + (+w[1]), 0, 112); render(); return; }
  if (e.target.closest('[data-weekreset]')) { S.over = {}; render(); return; }
  if (e.target.closest('[data-weekok]')) { S.weekDone = true; S.view = 'home'; render(); toast('Your week is saved as a guess. Nothing else changed.'); return; }
  if (e.target.closest('[data-qskip]')) { if (S.q < 5) S.q++; else S.view = 'home'; render(); return; }
  if (e.target.closest('[data-qprev]')) { S.q--; render(); return; }
  if (e.target.closest('[data-qnext]')) { S.qDone[S.q] = true; if (S.q < 5) { S.q++; render(); } else { S.view = 'home'; render(); toast('Questions saved. You can change any answer later.'); } return; }
  if ((el = e.target.closest('[data-pday]'))) { S.pickDay = el.dataset.pday; render(); return; }
  if ((el = e.target.closest('[data-mode]'))) { S.mode = el.dataset.mode; render(); return; }
  if ((el = e.target.closest('[data-dec]'))) { S.decision = el.dataset.dec; render(); return; }
  if (e.target.closest('[data-apply]')) { applyNow(); S.view = 'applied'; render(); toast('Saved in your plan.', function () { undoNow(); S.view = 'preview'; render(); }); return; }
  if (e.target.closest('[data-undo]')) { undoNow(); S.view = 'home'; render(); toast('Journey undone: templates, goals, dates and subcategories are back as before.'); return; }
  if (e.target.closest('[data-openplans]')) { TBDefaults.go('plans'); return; }
  if (e.target.closest('[data-notnow]')) { S.introSeen = true; S.view = 'home'; render(); TBDefaults.go('tap'); return; }
});
document.addEventListener('change', function (e) {
  var el;
  if ((el = e.target.closest('[data-tick]'))) S.ticks[el.dataset.tick] = el.checked;
  if ((el = e.target.closest('[data-subtick]'))) { var n = decodeURIComponent(el.dataset.subtick); if (el.checked) delete S.subOff[n]; else S.subOff[n] = true; }
  if ((el = e.target.closest('[data-flen]'))) { A('travel','trips')[+el.dataset.flen].len = clamp(parseInt(el.value, 10) || 30, 5, 480); render(); }
  if ((el = e.target.closest('[data-fclock]'))) { var pr = (el.value || '').split(':'); if (pr.length === 2) { A('travel','trips')[+el.dataset.fclock].start = (+pr[0]) * 60 + (+pr[1]); render(); } }
});
document.addEventListener('input', function (e) {
  var el;
  if ((el = e.target.closest('[data-tmp]'))) S.tmp[el.dataset.tmp] = el.value;
  if ((el = e.target.closest('[data-fname]'))) A('travel','trips')[+el.dataset.fname].name = el.value;
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-tag],[role=button][data-delown]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('[data-tmp]')) { var b = e.target.parentNode.querySelector('[data-addown]'); if (b) b.click(); }
});
load();
render();
TBData.onChange(function () { if (!busy) { load(); render(); } });
})();
</script>
</body>
</html>
